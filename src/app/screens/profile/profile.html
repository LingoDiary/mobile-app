
<app-content>
  <div wrapper>
    <div class="screen__heading">
      Profile
    </div>
    <div class="menu">

      <div class="menu__group">
        <div class="menu__group-heading">Personal data</div>
        <div class="menu__group-list">
          <a class="menu__item" [routerLink]="'/profile/name'">
            <fa-icon [icon]="faPencil" />
            Name
          </a>
          <a class="menu__item" [routerLink]="'/profile/passcode'">
            <fa-icon [icon]="faLock" />
            Passcode
          </a>
        </div>
      </div>

      <div class="menu__group">
        <div class="menu__group-heading">Learning</div>
        <div class="menu__group-list">
          <a class="menu__item" [routerLink]="'/profile/mentor'">
            <fa-icon [icon]="faUserTie" />
            Mentor
          </a>
          <a class="menu__item" [routerLink]="'/profile/native-language'">
            <fa-icon [icon]="faLanguage" />
            Native Language
          </a>
          <a class="menu__item" [routerLink]="'/profile/language-level'">
            <fa-icon [icon]="faArrowUpWideShort" />
            Language Level
          </a>
        </div>
      </div>

      <div class="menu__group">
        <div class="menu__group-heading">Account</div>
        <div class="menu__group-list">
          <a class="menu__item" [routerLink]="'/profile/reminder'">
            <fa-icon [icon]="faBell" />
            Reminder
          </a>
          <a class="menu__item" href="#">
            <fa-icon [icon]="faMoneyBill" />
            Subscription
          </a>
          <a
            class="menu__item"
            href="tg://resolve?domain=lingodiary_support"
            target="_blank"
            rel="noopener noreferrer"
          >
            <fa-icon [icon]="faHeadset"></fa-icon>
            Support
          </a>
        </div>
      </div>
    </div>
  </div>
  <div action>
    <app-navigation />
  </div>
</app-content>
