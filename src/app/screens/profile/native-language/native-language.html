<app-content>
  <div wrapper>
    <app-back [url]="'/profile'" />
    <div class="screen__heading">Native Language</div>
    <app-native-languages
      [inputValue]="value()"
      (validChange)="onValidChange($event)"
      (stateChange)="onStateChange($event)"
    />
  </div>
  <div action>
    <app-button
      (click)="onSave()"
      extraClass="full-width"
      [disabled]="!isValid()">
      Save
    </app-button>
  </div>
</app-content>
