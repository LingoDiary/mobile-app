<app-content>
  <div wrapper>
    <app-back [url]="'/profile'" />
    <div class="screen__heading">Passcode</div>
    <app-passcode
      (validChange)="onValidChange($event)"
      (stateChange)="onStateChange($event)"
    />
  </div>
  <div action>
    <app-button
      (click)="isPasscodeEntered() ? onSave() : onDrop()"
      extraClass="full-width"
      [disabled]="!isValid()">
      {{ isPasscodeEntered() ? 'Save' : 'Drop' }}
    </app-button>
  </div>
</app-content>
