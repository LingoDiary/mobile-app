<div class="dtp" [class.dtp--editable]="!disabled">
  <fa-icon [icon]="faCalendar" class="dtp__calendar"/>

  <input
    type="datetime-local"
    class="dtp__input"
    [value]="datetime()"
    [attr.min]="min"
    [attr.max]="max"
    (change)="onChange($event)"
    [disabled]="disabled"
  />

</div>
